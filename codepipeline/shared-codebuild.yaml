AWSTemplateFormatVersion: '2010-09-09'
Description: Shared CodeBuild projects for Terraform CI/CD pipelines.

Resources:
  # ---------------------------------------------------------------------------
  # Shared IAM Role for CodeBuild
  # ---------------------------------------------------------------------------
  SharedCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SharedCodeBuildBasePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - "arn:aws:s3:::*" # Adjust to your specific Terraform state buckets if needed

  # ---------------------------------------------------------------------------
  # Reusable CodeBuild Project: Terraform Plan (Lint, Validate, Format, Plan)
  # ---------------------------------------------------------------------------
  SharedTerraformPlanProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: "shared-terraform-plan"
      ServiceRole: !GetAtt SharedCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: TERRAFORM_VERSION
            Value: 1.10.5
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - curl -O https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                - unzip terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                - mv terraform /usr/local/bin/
                - echo "Installing TFLint..."
                - curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
            build:
              commands:
                - echo "Running Terraform Format Check..."
                - terraform fmt -check
                - echo "Running TFLint..."
                - tflint
                - echo "Running Terraform Init..."
                - terraform init
                - echo "Running Terraform Validate..."
                - terraform validate
                - echo "Running Terraform Plan..."
                - terraform plan -out=tfplan
          artifacts:
            files:
              - '**/*'

  # ---------------------------------------------------------------------------
  # Reusable CodeBuild Project: Terraform Apply
  # ---------------------------------------------------------------------------
  SharedTerraformApplyProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: "shared-terraform-apply"
      ServiceRole: !GetAtt SharedCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - Name: TERRAFORM_VERSION
            Value: 1.10.5
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              commands:
                - echo "Installing Terraform..."
                - curl -O https://releases.hashicorp.com/terraform/$TERRAFORM_VERSION/terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                - unzip terraform_${TERRAFORM_VERSION}_linux_amd64.zip
                - mv terraform /usr/local/bin/
            build:
              commands:
                - echo "Running Terraform Apply..."
                - terraform apply -input=false tfplan

Outputs:
  PlanProjectName:
    Description: Name of the shared Terraform Plan CodeBuild project
    Value: !Ref SharedTerraformPlanProject
    Export:
      Name: SharedTerraformPlanProjectName
  ApplyProjectName:
    Description: Name of the shared Terraform Apply CodeBuild project
    Value: !Ref SharedTerraformApplyProject
    Export:
      Name: SharedTerraformApplyProjectName